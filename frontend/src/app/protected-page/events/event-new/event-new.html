<div class="max-w-lg">
  <button (click)="cancel()" class="flex items-center gap-1 text-xs text-gray-500 hover:text-indigo-600 transition mb-6">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Terug naar kalender
  </button>

  <h1 class="text-xl font-semibold text-gray-800 mb-6">Nieuw event</h1>

  <form (ngSubmit)="save()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">Titel *</label>
      <input [(ngModel)]="form.title" name="title" type="text" required
        class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">Datum *</label>
      <input [(ngModel)]="form.date" name="date" type="date" required
        class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400" />
    </div>

    <div class="flex items-center gap-2">
      <input [(ngModel)]="form.allDay" name="allDay" type="checkbox" id="allDay"
        class="w-4 h-4 accent-indigo-600" />
      <label for="allDay" class="text-xs font-medium text-gray-700 cursor-pointer">Hele dag</label>
    </div>

    @if (!form.allDay) {
      <div class="flex gap-3">
        <div class="flex flex-col gap-1 flex-1">
          <label class="text-xs font-medium text-gray-700">Starttijd</label>
          <input [(ngModel)]="form.startTime" name="startTime" type="time" (change)="onStartTimeChange()"
            class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400" />
        </div>
        <div class="flex flex-col gap-1 flex-1">
          <label class="text-xs font-medium text-gray-700">Eindtijd</label>
          <input [(ngModel)]="form.endTime" name="endTime" type="time"
            class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400" />
        </div>
      </div>
    }

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">Locatie</label>
      <input [(ngModel)]="form.location" name="location" type="text"
        class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">Kleur</label>
      <div class="flex gap-2 flex-wrap">
        @for (option of colorOptions; track option[0]) {
          <button type="button" (click)="form.color = option[0]"
            [ngStyle]="{ 'background-color': option[1].bg }"
            [class.ring-2]="form.color === option[0]"
            class="px-3 py-1.5 rounded-sm text-xs font-medium ring-gray-400 transition">
            {{ option[1].label }}
          </button>
        }
      </div>
    </div>

    <div class="flex gap-3 mt-2">
      <button type="submit" [disabled]="saving()"
        class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-sm transition disabled:opacity-50">
        {{ saving() ? 'Opslaan...' : 'Opslaan' }}
      </button>
      <button type="button" (click)="cancel()"
        class="border border-gray-200 text-gray-600 hover:bg-gray-50 text-sm px-4 py-2 rounded-sm transition">
        Annuleren
      </button>
    </div>
  </form>
</div>
