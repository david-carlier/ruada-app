<div class="max-w-lg">
  <button (click)="cancel()" class="flex items-center gap-1 text-xs text-gray-500 hover:text-indigo-600 transition mb-6">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Terug naar discografie
  </button>

  <h1 class="text-xl font-semibold text-gray-800 mb-6">Nieuw nummer</h1>

  <form (ngSubmit)="save()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">Titel *</label>
      <input [(ngModel)]="form.title" name="title" type="text" required
        class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">Artiest</label>
      <input [(ngModel)]="form.artist" name="artist" type="text"
        class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">Genre</label>
      <select [(ngModel)]="form.genre" name="genre"
        class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400">
        @for (option of genreOptions; track option[0]) {
          <option [value]="option[0]">{{ option[1] }}</option>
        }
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">Spotify link</label>
      <input [(ngModel)]="form.spotify" name="spotify" type="url" placeholder="https://open.spotify.com/..."
        class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">YouTube link</label>
      <input [(ngModel)]="form.youtube" name="youtube" type="url" placeholder="https://www.youtube.com/watch?v=..."
        class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">Songtekst</label>
      <textarea [(ngModel)]="form.lyrics" name="lyrics" rows="12" placeholder="Plak hier de songtekst..."
        class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400 resize-y font-mono"></textarea>
    </div>

    <div class="flex gap-3 mt-2">
      <button type="submit" [disabled]="saving()"
        class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-sm transition disabled:opacity-50">
        {{ saving() ? 'Opslaan...' : 'Opslaan' }}
      </button>
      <button type="button" (click)="cancel()"
        class="border border-gray-200 text-gray-600 hover:bg-gray-50 text-sm px-4 py-2 rounded-sm transition">
        Annuleren
      </button>
    </div>
  </form>
</div>
