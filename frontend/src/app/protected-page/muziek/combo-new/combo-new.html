<div class="max-w-lg">
  <button (click)="cancel()" class="flex items-center gap-1 text-xs text-gray-500 hover:text-indigo-600 transition mb-6">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Terug naar muziek
  </button>

  <h1 class="text-xl font-semibold text-gray-800 mb-6">Nieuwe combinatie maken</h1>

  <div class="flex flex-col gap-6">
    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">Naam *</label>
      <input [(ngModel)]="title" name="title" type="text"
        class="border border-gray-200 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-gray-700">Nummers selecteren</label>
      <div class="flex flex-col divide-y divide-gray-100 border border-gray-100 rounded-sm max-h-72 overflow-y-auto">
        @for (song of songs; track song.id) {
          <label class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" [checked]="isSelected(song.id)" (change)="toggleSong(song.id)"
              class="accent-indigo-600" />
            <span class="text-sm text-gray-800">{{ song.title }}</span>
            @if (song.artist) {
              <span class="text-xs text-gray-400">{{ song.artist }}</span>
            }
          </label>
        }
      </div>
    </div>

    @if (selectedIds().length > 0) {
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-gray-700">Volgorde</label>
        <div class="flex flex-col divide-y divide-gray-100 border border-gray-100 rounded-sm">
          @for (id of selectedIds(); track id; let i = $index) {
            <div class="flex items-center gap-3 px-4 py-3">
              <span class="text-xs text-indigo-400 font-semibold w-4">{{ i + 1 }}</span>
              <span class="text-sm text-gray-800 flex-1">{{ songTitle(id) }}</span>
              <div class="flex gap-1">
                <button type="button" (click)="moveUp(i)" [disabled]="i === 0"
                  class="p-1 text-gray-400 hover:text-gray-700 disabled:opacity-30">
                  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
                </button>
                <button type="button" (click)="moveDown(i)" [disabled]="i === selectedIds().length - 1"
                  class="p-1 text-gray-400 hover:text-gray-700 disabled:opacity-30">
                  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
              </div>
            </div>
          }
        </div>
      </div>
    }

    <div class="flex gap-3 mt-2">
      <button (click)="save()" [disabled]="saving() || !title || selectedIds().length === 0"
        class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-sm transition disabled:opacity-50">
        {{ saving() ? 'Opslaan...' : 'Opslaan' }}
      </button>
      <button type="button" (click)="cancel()"
        class="border border-gray-200 text-gray-600 hover:bg-gray-50 text-sm px-4 py-2 rounded-sm transition">
        Annuleren
      </button>
    </div>
  </div>
</div>
